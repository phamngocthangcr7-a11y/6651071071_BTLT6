<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Câu 3 - Thêm hàng vào bảng</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <h1>Insert row in a table</h1>
      <table id="sampleTable">
        <tbody>
          <tr><td>Row1 cell1</td><td>Row1 cell2</td></tr>
          <tr><td>Row2 cell1</td><td>Row2 cell2</td></tr>
        </tbody>
      </table>
      <div class="actions">
        <button id="domInsert" type="button">Insert Row (DOM)</button>
        <button id="jqueryInsert" type="button">Insert Row (jQuery)</button>
      </div>
    </main>
  </body>
</html>
