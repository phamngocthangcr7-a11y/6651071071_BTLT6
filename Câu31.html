<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />

    <title>Remove items from a dropdown list</title>

    <style>
      body {
        margin: 30px;
      }
    </style>
  </head>

  <body>
    <form>
      <select id="colorSelect">
        <option>Red</option>
        <option>Green</option>
        <option>White</option>
        <option>Black</option>
      </select>

      <input type="button" onclick="removecolor()" value="Select and Remove" />
    </form>

    <script>
      function removecolor() {
        var select = document.getElementById("colorSelect");

        var vitri = select.selectedIndex;

        if (vitri >= 0) {
          select.remove(vitri);
        }
      }
    </script>
  </body>
</html>
