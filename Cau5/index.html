<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Câu 5 - Hiển thị ảnh ngẫu nhiên</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <h1>Display a random image</h1>
      <div class="actions">
        <button id="domShow" type="button">Show Image (DOM)</button>
        <button id="jqueryShow" type="button">Show Image (jQuery)</button>
      </div>
      <div id="imageContainer" aria-live="polite">
        <p>Nhấn nút để chọn ngẫu nhiên một hình ảnh.</p>
      </div>
    </main>
  </body>
