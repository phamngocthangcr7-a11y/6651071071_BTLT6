<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Câu 6 - Đếm các mục trong dropdown</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <h1>Count and display items of a dropdown list</h1>
      <label for="colorSelect">Select your favorite Color:</label>
      <select id="colorSelect">
        <option>Red</option>
        <option>Green</option>
        <option>Blue</option>
        <option>White</option>
      </select>
      <div class="actions">
        <button id="domCount" type="button">Count items (DOM)</button>
        <button id="jqueryCount" type="button">Count items (jQuery)</button>
      </div>
    </main>
  </body>
</html>
